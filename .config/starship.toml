'$schema' = 'https://starship.rs/config-schema.json'

format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$c\
$nodejs\
$vcsh\
$zig\
$time\
[](fg:background-color)\
$cmd_duration\
$line_break\
$jobs\
$character
"""

palette = 'base16_eighties'

[os.symbols]
Macos = '󰀵'
Linux = '󰌽'
Gentoo = '󰣨'
Fedora = '󰣛'
Void = ''

[os]
disabled = false
style = 'fg:purple bg:background-color'
format = '[ $symbol]($style)'

[username]
show_always = true
style_user = 'fg:purple bg:background-color'
style_root = 'fg:bold red bg:background-color'
format = '[ $user ]($style)'

[directory]
disabled = false
fish_style_pwd_dir_length = 1
truncation_length = 5
truncate_to_repo = true
truncation_symbol = '…/'
read_only_style = 'fg:bold red'
style = 'fg:blue bg:background-color'
format = '[ $path ]($style)'

[git_branch]
symbol = ''
format = '[[ $symbol $branch ](fg:yellow bg:background-color)]($style)'

# [status symbols](https://starship.rs/config/#options-37)
[git_status]
format = '[[($all_status$ahead_behind )](fg:red bg:background-color)]($style)'

[c]
symbol = ''
format = '[[ $symbol( $version) ](fg:comment-color bg:background-color)]($style)'

[nodejs]
symbol = ''
format = '[[ $symbol( $version) ](fg:comment-color bg:background-color)]($style)'

[vcsh]
symbol = '🆅 '
format = '[[ $symbol( $repo) ](fg:comment-color bg:background-color)]($style)'

[zig]
symbol = ''
format = '[[ $symbol( $version) ](fg:comment-color bg:background-color)]($style)'

[time]
disabled = false
time_format = '%R'
style = 'fg:cyan bg:background-color'
format = '[  $time ]($style)'

[cmd_duration]
show_milliseconds = true
disabled = false
show_notifications = true
min_time_to_notify = 45000
style = 'comment-color'
format = '[  in $duration]($style)'

[line_break]
disabled = false

[jobs]
number_threshold = 1
format = '[$symbol]($style)'

[character]
disabled = false
success_symbol = '[❯](bold fg:bold green)'
error_symbol = '[❯](bold fg:bold red)'
vimcmd_symbol = '[❮](bold fg:bold green)'
vimcmd_replace_one_symbol = '[❮](bold fg:bold purple)'
vimcmd_replace_symbol = '[❮](bold fg:bold purple)'
vimcmd_visual_symbol = '[❮](bold fg:bold yellow)'

[palettes.base16_eighties]
background-color = '#393939'
blue = '#6699CC'
cyan = '#66CCCC'
green = '#99CC99'
orange = '#F99157'
purple = '#CC99CC'
red = '#F2777A'
white = '#D3D0C8'
yellow ='#FFCC66'
comment-color = '#A09F93'
