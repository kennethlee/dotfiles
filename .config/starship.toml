'$schema' = 'https://starship.rs/config-schema.json'

format = """
[](black)\
$os\
$username\
$directory\
$git_branch\
$git_status\
$c\
$nodejs\
$vcsh\
$zig\
$time\
[](fg:black)\
$cmd_duration\
$line_break\
$jobs\
$character
"""

palette = 'base16_eighties'

[os.symbols]
Macos = '󰀵'
Linux = '󰌽'
Gentoo = '󰣨'
Fedora = '󰣛'
Void = ''

[os]
disabled = false
style = 'fg:purple bg:black'
format = '[$symbol ]($style)'

[username]
show_always = true
style_user = 'fg:purple bg:black'
style_root = 'fg:bold red bg:black'
format = '[$user ]($style)'

[directory]
disabled = false
truncation_symbol = '…/'
style = 'fg:blue bg:black'
format = '[ $path ]($style)'

[git_branch]
symbol = ''
format = '[[ $symbol $branch ](fg:yellow bg:black)]($style)'

[git_status]
format = '[[($all_status$ahead_behind )](fg:red bg:black)]($style)'

[nodejs]
symbol = ''
format = '[[ $symbol( $version) ](fg:black-black bg:black)]($style)'

[c]
symbol = ''
format = '[[ $symbol( $version) ](fg:bright-black bg:black)]($style)'

[vcsh]
symbol = '🆅 '
format = '[[ $symbol( $repo) ](fg:bright-black bg:black)]($style)'

[zig]
symbol = ''
format = '[[ $symbol( $version) ](fg:bright-black bg:black)]($style)'

[time]
disabled = false
time_format = '%R'
style = 'fg:cyan bg:black'
format = '[  $time]($style)'

[cmd_duration]
show_milliseconds = true
disabled = false
show_notifications = true
min_time_to_notify = 45000
style = 'bright-black'
format = '[  in $duration]($style)'

[line_break]
disabled = false

[jobs]
number_threshold = 1
format = '[$symbol]($style)'

[character]
disabled = false
success_symbol = '[❯](bold fg:bold green)'
error_symbol = '[❯](bold fg:bold red)'
vimcmd_symbol = '[❮](bold fg:bold green)'
vimcmd_replace_one_symbol = '[❮](bold fg:bold purple)'
vimcmd_replace_symbol = '[❮](bold fg:bold purple)'
vimcmd_visual_symbol = '[❮](bold fg:bold yellow)'

[palettes.base16_eighties]
black = '#393939'
blue = '#6699CC'
cyan = '#66CCCC'
green = '#99CC99'
orange = '#F99157'
purple = '#CC99CC'
red = '#F2777A'
white = '#D3D0C8'
yellow ='#FFCC66'
bright-black = '#747369'
